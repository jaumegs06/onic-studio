name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta a las 00:00 UTC los lunes y jueves (cada 3-4 días)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Permite ejecutarlo manualmente para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/productos?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
      
      - name: Log success
        run: echo "✅ Supabase pinged successfully at $(date)"
